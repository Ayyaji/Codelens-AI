services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - codelens_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  codelens_mongo:
